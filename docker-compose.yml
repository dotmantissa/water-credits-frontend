services:
  web:
    build:
      context: .
      # Target the build stage only — ng serve runs from source, so we
      # never need the Nginx production stage for local development.
      target: build
    command: npm start -- --host 0.0.0.0 --poll 1000
    ports:
      - "4200:4200"
    volumes:
      # Mount source for hot reload...
      - .:/app
      # ...but keep node_modules from the image, not the host, so
      # platform-specific native deps built during `npm ci` aren't
      # clobbered by a host bind mount.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true