server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    # 'unsafe-inline' on style-src is required because Angular injects
    # component styles as inline <style> tags at runtime.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        image/svg+xml;

    # ---- Aggressive caching for fingerprinted static assets ----
    # Angular's build output hashes JS/CSS filenames, so these are safe to
    # cache for a long time; index.html itself is explicitly excluded below
    # so new deployments are picked up immediately.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    # Any route not matched above (including lazy-loaded chunk requests
    # that miss, and all Angular Router paths) falls back to index.html
    # so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}